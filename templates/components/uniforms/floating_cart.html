<!-- Floating Cart Button -->
{% if is_aluno %}
<div id="floating-cart" class="hidden animate-bounce-in"
    style="position: fixed; bottom: 2rem; right: 2rem; z-index: 9998;">
    <button onclick="goToCheckout()"
        class="bg-gray-900 text-white p-4 rounded-2xl shadow-2xl flex items-center gap-3 hover:scale-105 transition-transform">
        <div class="relative">
            <span class="text-2xl">🛒</span>
            <span id="cart-count"
                class="absolute -top-2 -right-2 bg-yellow-400 text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-gray-900">0</span>
        </div>
        <span class="font-bold">Meu Carrinho</span>
    </button>
</div>
{% endif %}
