<div>
    <div class="flex items-center justify-between mb-1.5">
        <label for="id_password" class="block text-sm font-semibold text-gray-700">Senha</label>
        {% if show_forgot_password %}
        <button type="button" id="forgot-password-btn"
            class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors cursor-pointer hover:underline">
            Esqueci minha senha
        </button>
        {% endif %}
    </div>
    <input type="password" name="password" id="id_password" required
        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition-all bg-gray-50/50 text-gray-800 placeholder-gray-400"
        placeholder="Digite sua senha">
</div>
