<!-- Forgot Password Modal -->
<div id="password-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div id="password-modal-content" class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl transform scale-95 transition-transform duration-300 border border-gray-100">
        <div class="text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-5 text-3xl shadow-inner">
                🔑
            </div>
            
            <h3 class="text-2xl font-bold text-gray-900 mb-3">Recuperação de Senha</h3>
            
            <p class="text-gray-600 text-base leading-relaxed mb-6">
                Para redefinir a sua senha de acesso, por favor, entre em contato ou dirija-se pessoalmente à **secretaria escolar** da escola. 
                <br><br>
                Por motivos de segurança e privacidade dos dados dos alunos, as credenciais de acesso são geradas e validadas exclusivamente de forma presencial.
            </p>
            
            <button id="close-password-modal" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 active:scale-[0.98] text-white font-bold py-3.5 px-4 rounded-xl transition-all duration-200 shadow-lg cursor-pointer">
                Entendido
            </button>
        </div>
    </div>
</div>
